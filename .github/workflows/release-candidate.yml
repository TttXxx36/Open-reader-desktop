name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload unsigned installer and portable artifacts for maintainer review"
        required: true
        default: true
        type: boolean

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($expected -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $expected"
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Strict release preflight
        run: npm run verify:release:strict

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Package portable version
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release"
          $exe = Get-ChildItem -LiteralPath $releaseDir -Filter "*.exe" -File |
            Where-Object { $_.FullName -notmatch "\\bundle\\" } |
            Select-Object -First 1
          if (-not $exe) {
            throw "Portable executable not found under $releaseDir"
          }

          $portableDir = Join-Path $env:RUNNER_TEMP "Open-Reader-Desktop-portable"
          if (Test-Path -LiteralPath $portableDir) {
            Remove-Item -LiteralPath $portableDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $portableDir "Open-Reader-Desktop.exe")
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $portableDir "LICENSE")
          Copy-Item -LiteralPath "README.md" -Destination (Join-Path $portableDir "README.md")

          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          $portableZip = Join-Path $env:GITHUB_WORKSPACE "Open-Reader-Desktop-v$($package.version)-portable.zip"
          if (Test-Path -LiteralPath $portableZip) {
            Remove-Item -LiteralPath $portableZip -Force
          }
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -Force

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\bundle"
          $portable = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter "*-portable.zip" -File
          $assets = @(Get-ChildItem -LiteralPath $bundle -File -Recurse) + @($portable)
          if (-not $assets) {
            throw "No Windows release assets found"
          }

          $manifest = Join-Path $env:GITHUB_WORKSPACE "release-sha256.txt"
          $assets |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              $relative = $_.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1)
              "$($hash.Hash.ToLowerInvariant())  $relative"
            } | Set-Content -LiteralPath $manifest -Encoding utf8

      - name: Normalize artifact label
        shell: pwsh
        run: |
          $label = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]+', '-'
          if ([string]::IsNullOrWhiteSpace($label)) {
            $label = "source"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_ARTIFACT_LABEL=$label" -Encoding utf8

      - name: Upload workflow artifacts
        if: ${{ inputs.upload_artifacts || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: open-reader-windows-${{ env.RELEASE_ARTIFACT_LABEL }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle
            *-portable.zip
            release-sha256.txt

      - name: Publish unsigned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\bundle"
          $portable = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter "*-portable.zip" -File
          $manifest = Join-Path $env:GITHUB_WORKSPACE "release-sha256.txt"
          $assets = @(Get-ChildItem -LiteralPath $bundle -File -Recurse | ForEach-Object FullName)
          $assets += $portable.FullName
          $assets += $manifest

          gh release create "${{ github.ref_name }}" @assets --repo $env:GITHUB_REPOSITORY --title "Open Reader Desktop ${{ github.ref_name }} (unsigned)" --notes "Automated Windows release. Includes Tauri installers and a portable ZIP. Artifacts are currently unsigned; Windows SmartScreen may show a warning. WebView2 Runtime is required."
