name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: UI contract check
        run: npm run verify:ui
      - name: Release preflight
        run: npm run verify:release

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: TXT performance evidence
        if: success()
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v cargo test --manifest-path src-tauri/Cargo.toml records_txt_size_matrix_baseline -- --exact --nocapture 2>txt-performance-time.log | tee txt-performance-output.log
          cat txt-performance-time.log
      - name: Upload TXT performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txt-performance-${{ github.sha }}
          path: |
            txt-performance-output.log
            txt-performance-time.log
