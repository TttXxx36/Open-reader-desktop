[package]
name = "open-reader-desktop"
version = "0.1.0"
description = "A Windows-first open-source desktop reader"
authors = ["TttXxx36"]
edition = "2021"

[lib]
name = "open_reader_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
